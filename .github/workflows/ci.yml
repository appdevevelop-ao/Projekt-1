name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Kernlogik (Linux, swift test)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v5
      - name: Tests
        run: swift test --package-path Packages/LernKern

  backend:
    name: KI-Backend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests
        run: |
          npm ci --prefix Backend
          npm test --prefix Backend

  ios:
    name: iOS-App (Build + Tests im Simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Neueste stabile Xcode-Version wählen
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          echo "Verwende $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Projekt erzeugen
        run: xcodegen generate
      - name: Kernlogik-Tests (macOS)
        run: swift test --package-path Packages/LernKern
      - name: Build und Tests (iOS Simulator)
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]; print(ids[-1] if ids else '')")
          echo "Simulator: $DEVICE_ID"
          xcodebuild test \
            -project LernFokus.xcodeproj \
            -scheme LernFokus \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|Test Suite|Executed|BUILD|\*\*" || true
          tail -5 xcodebuild.log
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
      - name: Fehler-Log
        if: failure()
        run: |
          grep -E "error:|Test Case .* failed|XCTAssert|Restarting after unexpected exit|crashed" -A3 xcodebuild.log | head -200 || true
          tail -60 xcodebuild.log || true
